[package]
name = "nbt-aad-cli"
description = "Experimental Rust CLI for managing NBT-AAD updates (not ready for vehicle use)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nbt-aad-manager"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
getrandom = "0.4.3"
hex = "0.4.3"
nbt-aad-core = { version = "0.0.1", path = "../nbt-aad-core" }
nbt-aad-release = { version = "0.0.1", path = "../nbt-aad-release" }
nbt-aad-transport-ssh = { version = "0.0.1", path = "../nbt-aad-transport-ssh" }
rpassword = "7.5.4"
sha2 = "0.11.1"
tar = "0.4.46"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros"] }
zeroize = "1.9.1"

[dev-dependencies]
nbt-aad-core = { path = "../nbt-aad-core", features = ["testkit"] }
nbt-aad-transport-ssh = { path = "../nbt-aad-transport-ssh", features = ["testkit"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "dsa", "des"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
