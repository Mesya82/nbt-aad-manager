[package]
name = "nbt-aad-release"
description = "Fetch and verify pinned upstream NBT-AAD releases (bounded HTTPS + ZIP); not ready for vehicle use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nbt-aad-core = { version = "0.0.1", path = "../nbt-aad-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
