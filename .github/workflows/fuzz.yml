name: Fuzz campaign (scheduled; NOT hardware acceptance)

# Longer fuzzing outside normal CI (TEST_STRATEGY 5). Normal CI replays the
# checked-in corpus on stable (crates/nbt-aad-release/tests/fuzz_corpus.rs).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [read_zip, release_json, archive_layout, parse_ls, readback_tsv]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -max_total_time=600 -rss_limit_mb=2048
        working-directory: .
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
