name: Rust scaffold checks (NOT hardware acceptance)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.os }} - Rust compile, lint, unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo build --release

# IMPORTANT: These checks only verify the minimal initial Rust scaffold.
# Simulator E2E, fault injection, archive fuzz, coverage and hardware-review
# gates specified in docs/TEST_STRATEGY.md MUST be added before any live use.
