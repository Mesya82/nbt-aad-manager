[workspace]
resolver = "3"
members = ["crates/nbt-aad-core", "crates/nbt-aad-transport-ssh", "crates/nbt-aad-release", "crates/nbt-aad-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Mesya82/nbt-aad-manager"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# RSA/DSA key generation in tests is very slow without optimisation.
[profile.dev.package."*"]
opt-level = 2
